version = 2
template = "deepagents/research"
name = "Research DeepAgent"
description = "DeepAgents research application with Tavily-backed web research and a browser frontend."
env_file = ".env"
guide = "README.md"

[env.SEEKDB_EMBED]
required = true
default = "true"
description = "Use embedded AgentSeek API checkpoint persistence."

[env.SEEKDB_EMBED_DIR]
required = true
default = "~/.agentseek/research_deepagent/seekdb"
description = "Embedded AgentSeek API persistence directory."

[env.OCEANBASE_DB_NAME]
required = true
default = "test"
description = "Embedded AgentSeek API database name."

[tools]
required = ["uv", "node", "npm"]

[paths]
required = ["pyproject.toml", "langgraph.json", "frontend/package.json", "frontend/node_modules"]

[env.AGENTSEEK_MODEL_PROVIDER]
required = true
default = "openai"
description = "LangChain model provider used by the research graph."

[env.AGENTSEEK_MODEL]
required = true
default = "gpt-4.1-mini"
description = "Model id used by the research graph."
aliases = ["DEEPAGENTS_MODEL", "BUB_MODEL"]

[env.OPENAI_API_KEY]
required = true
description = "Credential for the selected model provider."
aliases = ["ANTHROPIC_API_KEY", "GOOGLE_API_KEY", "BUB_OPENAI_API_KEY"]

[env.TAVILY_API_KEY]
required = true
description = "Tavily search API key used by tavily_search."

[env.LANGCHAIN_OPENAI_STREAM_CHUNK_TIMEOUT_S]
required = false
default = "300"
description = "OpenAI stream chunk gap timeout in seconds."

[services.langgraph]
name = "AgentSeek API"
url = "http://127.0.0.1:2024"
tech = "agentseek-api"
kind = "api"
display = "advanced"
primary = false
description = "AgentSeek API runtime that runs the DeepAgents research graph."
links = { docs = "https://docs.langchain.com/oss/python/langgraph/overview", api_docs = "http://127.0.0.1:2024/docs", studio = "https://smith.langchain.com/studio/?baseUrl=http://127.0.0.1:2024" }

[services.frontend]
name = "Research application"
url = "http://127.0.0.1:5174"
kind = "web"
display = "default"
primary = true
description = "Browser application for submitting research requests and reviewing streamed results."
tech = "vite"
links = { docs = "https://vite.dev/guide/" }

[processes.langgraph]
command = ["uv", "run", "agentseek-api", "dev", "--port", "2024"]

[processes.frontend]
command = ["npm", "run", "dev"]
cwd = "frontend"

[checks.langgraph]
type = "http"
target = "http://127.0.0.1:2024/health"
service = "langgraph"
timeout = 2
attempts = 3

[checks.frontend]
type = "http"
target = "http://127.0.0.1:5174"
service = "frontend"
timeout = 2
attempts = 3

[tasks.sync]
description = "Install Python dependencies with uv."
command = ["uv", "sync"]

[tasks.frontend]
description = "Install frontend dependencies."
command = ["npm", "install", "--prefix", "frontend"]
