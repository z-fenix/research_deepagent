[project]
name = "research_deepagent"
version = "0.1.0"
description = "Research DeepAgent — DeepAgents research agent served by langgraph dev (langgraph-api)."
authors = [{ name = "Your Name" }]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.21",
    "langchain>=1.4.3",
    "langchain-anthropic==1.7.5",
    "langchain-google-genai>=4.0",
    "langchain-openai>=0.3",
    "tavily-python>=0.5",
    "httpx[socks]>=0.28",
    "markdownify>=0.13",
    "python-dotenv>=1.0",
    "mcp>=1.27.1,<2",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.12",
    "langgraph-cli[inmem]>=0.4.32",
    "langgraph-sdk>=0.4.5",
    "langgraph-checkpoint-sqlite>=3.1.1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
